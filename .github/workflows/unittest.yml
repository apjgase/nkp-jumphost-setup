name: unittest

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rocky9:
    name: unittest (Rocky Linux 9, system Python 3.9)
    runs-on: ubuntu-latest
    container: rockylinux/rockylinux:9
    steps:
      - uses: actions/checkout@v4
      - run: python3 --version && python3 -m unittest -v test_nkp_lab

  current:
    name: unittest (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 -m unittest -v test_nkp_lab
